<title>Bodega Madrid Horse Week</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first single column (max 720px) — slim sticky header, scrolling content, fixed 5-tab bar; action bars dock above the tabs */
:root{
  --bg:#f1f3ee; --surface:#ffffff; --surface-2:#e7ebe3; --line:#d9dfd4; --fg:#16201a; --muted:#5b675e;
  --accent:#1c5a43; --accent-2:#2b7a5c; --accent-fg:#ffffff; --accent-soft:#dcebe2;
  --gold:#b8862f; --ok:#2b7a3b; --warn:#9a6200; --warn-soft:#f6eacf; --bad:#b3261e; --bad-soft:#f9dfdb;
  --shadow:0 1px 2px rgba(22,32,26,.06),0 6px 18px rgba(22,32,26,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface-2:#212b25; --line:#2e3a32; --fg:#e7ece6; --muted:#9aa79e;
  --accent:#5fb68f; --accent-2:#79c7a3; --accent-fg:#0b1510; --accent-soft:#1c3529;
  --gold:#d9a94e; --ok:#6cc27d; --warn:#e2a744; --warn-soft:#3a2e16; --bad:#f2847a; --bad-soft:#3f201c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface-2:#212b25; --line:#2e3a32; --fg:#e7ece6; --muted:#9aa79e;
  --accent:#5fb68f; --accent-2:#79c7a3; --accent-fg:#0b1510; --accent-soft:#1c3529;
  --gold:#d9a94e; --ok:#6cc27d; --warn:#e2a744; --warn-soft:#3a2e16; --bad:#f2847a; --bad-soft:#3f201c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand{flex:1;min-width:0;line-height:1.15}
.brand small{display:block;font:600 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{display:block;font:700 1.15rem var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#conn{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--body);padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
#conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
#conn[data-s="live"]::before{background:var(--ok)}#conn[data-s="offline"]{background:var(--warn-soft);color:var(--warn)}#conn[data-s="offline"]::before{background:var(--warn)}
main{padding-block:18px 170px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{background:none;border:0;color:var(--muted);padding:6px 2px;font:600 .74rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav.tabs button .pip{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .15s}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] .pip{background:var(--accent-soft);color:var(--accent)}
/* type */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.eyebrow{font:600 .78rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.86rem}.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 16px;font:600 1rem var(--body);cursor:pointer;min-height:48px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}

.hello{display:flex;flex-direction:column;gap:4px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{appearance:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:inherit;min-width:0}
.act b{font:700 1.05rem var(--display);letter-spacing:.02em;text-transform:uppercase}
.act span{font-size:.8rem;color:var(--muted)}
.act .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.act.hero{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow);padding:18px}
.act.hero b{font-size:1.45rem}.act.hero span{color:inherit;opacity:.85}
.act.hero .ic{background:rgba(255,255,255,.16);color:inherit;width:48px;height:48px}
.act.hero .go{margin-left:auto}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cnt{appearance:none;text-align:left;cursor:pointer;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cnt b{font:700 1.1rem var(--display);text-transform:uppercase;letter-spacing:.03em}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bad-soft)}
.alert .qty{color:var(--bad)}
/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:5px;font:700 .7rem var(--body);padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:8px 14px;font:600 .88rem var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:9px 2px;font:600 .86rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.search{position:relative}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{padding-left:44px;border-radius:99px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* zone picker */
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zone{appearance:none;cursor:pointer;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;justify-content:center}
.zone b{font:700 1.7rem var(--display);line-height:1}.zone span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.zone em{font-style:normal;font-size:.7rem;color:var(--accent);font-weight:600}
.zone.wide{grid-column:1/-1;flex-direction:row;gap:12px;min-height:60px}.zone.wide b{font-size:1.3rem;text-transform:uppercase}
.dest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg)}
.dest b{font:700 1.3rem var(--display)}
.dest .btn{margin-left:auto;min-height:38px;padding:6px 12px}
/* product list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.cathead{padding:9px 16px;background:var(--surface-2);font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 16px;transition:background .15s}
.prow.on{background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.prow .pn{min-width:0}
.prow .pn b{display:block;font-weight:600;line-height:1.25}
.prow .pn small{color:var(--muted);font-size:.8rem}
.prow .steps{grid-column:1/-1;justify-content:flex-start}
@media (min-width:560px){.prow .steps{grid-column:auto;justify-content:flex-end}}
.qty{font:600 1.2rem var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.step button{width:44px;height:46px;border:0;background:var(--surface-2);color:var(--fg);font:700 1.4rem var(--display);cursor:pointer;display:grid;place-items:center}
.step button:active{background:var(--accent-soft)}
.step label{display:flex;flex-direction:column;align-items:center;padding:0 2px;min-width:50px}
.step input{width:48px;border:0;border-radius:0;text-align:center;padding:2px;font:700 1.2rem var(--display);font-variant-numeric:tabular-nums;background:transparent}
.step label span{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.diff{grid-column:1/-1;font-size:.84rem}
.diff .bad{color:var(--bad);font-weight:700}.diff .ok{color:var(--ok);font-weight:600}
/* docked bar */
.dock{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5;padding-block:10px;pointer-events:none}
.dock .wrap>div{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dock .sum{flex:1;min-width:0;font-size:.92rem}.dock .sum .muted{color:inherit;opacity:.7}
.dock .btn{min-height:44px;border-color:transparent}
.dock .btn.primary{background:var(--accent-2);color:#06120c}
.dock .btn.sec{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
/* misc */
.notice{border-radius:14px;padding:12px 14px;background:var(--warn-soft);font-size:.93rem;display:flex;gap:10px;align-items:flex-start}
.notice.bad{background:var(--bad-soft)}.notice.ok{background:var(--accent-soft)}
.notice svg{margin-top:1px}
.empty{text-align:center;padding:30px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.empty b{color:var(--fg);font:700 1.3rem var(--display);text-transform:uppercase}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.done .ic svg{width:32px;height:32px;stroke-width:2.5}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:140px}
th{font-weight:700;color:var(--muted);background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
td.neg{color:var(--bad);font-weight:700}
.mov{padding:14px 16px;cursor:pointer}
.mov .top{display:flex;gap:10px;align-items:center}
.mov .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.mov .ti svg{width:18px;height:18px}
.mov .tx{flex:1;min-width:0}.mov .tx b{font-weight:600}
.mov.void{opacity:.55}.mov.void .tx b{text-decoration:line-through}
.mov .detail{margin-top:12px;display:flex;flex-direction:column;gap:8px;padding-left:46px}
.menu{display:flex;flex-direction:column}
.menu button{appearance:none;font:inherit;color:var(--fg);background:none;border:0;display:flex;align-items:center;gap:14px;padding:16px;text-align:left;cursor:pointer}
.menu button .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.menu button b{display:block;font-weight:600}.menu button span{font-size:.84rem;color:var(--muted)}
.menu button .chev{margin-left:auto;color:var(--muted)}
.back{align-self:flex-start}
canvas.sig{width:100%;height:170px;background:#fbfbf8;border:1.5px dashed var(--line);border-radius:14px;touch-action:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:400px){.actions{grid-template-columns:1fr 1fr 1fr;gap:8px}.act{padding:12px 10px}.act b{font-size:.95rem}.zones{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr}h1{font-size:1.75rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" class="i"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8 13h8"/></svg></div>

<script>
"use strict";
/* ---------- constantes ---------- */
const CATS=['Agua','Refresco','Cerveza','Vino blanco','Vino tinto','Rosado','Cava / Champán','Destilado','Zumo','Café / otros'];
const DEFAULT_CFG={event:'Madrid Horse Week',venue:'IFEMA Madrid',caterer:'Zalacaín',
  days:['2026-11-26','2026-11-27','2026-11-28','2026-11-29'],
  zones:[...Array.from({length:13},(_,i)=>'Palco '+(i+1)),'Restaurante']};
const TYPES={entrada:{label:'Entrada',long:'Entrada de proveedor'},salida:{label:'Salida',long:'Salida a zona'},
  devolucion:{label:'Devolución',long:'Devolución de zona'},merma:{label:'Merma',long:'Merma / rotura'}};
const BODEGA='Bodega';
const SAMPLE=[['Agua mineral 50 cl','Agua','Botella 50 cl',24,48,0.35],['Agua con gas 33 cl','Agua','Botella 33 cl',24,24,0.5],
 ['Refresco cola lata 33 cl','Refresco','Lata 33 cl',24,48,0.55],['Cerveza lata 33 cl','Cerveza','Lata 33 cl',24,72,0.6],
 ['Cerveza barril 30 L','Cerveza','Barril 30 L',1,2,75],['Vino blanco D.O. 75 cl','Vino blanco','Botella 75 cl',6,12,6.5],
 ['Vino tinto D.O. 75 cl','Vino tinto','Botella 75 cl',6,12,7.2],['Cava brut 75 cl','Cava / Champán','Botella 75 cl',6,12,8],
 ['Ginebra 70 cl','Destilado','Botella 70 cl',6,3,14],['Zumo naranja 20 cl','Zumo','Botella 20 cl',24,24,0.6]];

/* ---------- estado ---------- */
const S={tab:'inicio',srv:{products:{},movements:{},counts:{}},cfg:null,db:null,user:null,uid:null,
  canWrite:true,isOwner:false,online:'loading',outbox:[],flushing:false,
  day:todayKey(),q:'',cat:'',histType:'',open:null,voiding:null,repDay:null,
  mv:{type:'salida',zone:'',items:{},ref:'',note:'',receiver:'',sig:'',step:'items',q:'',cat:''},
  lastSaved:null,cntKind:'cierre',editP:null,importOpen:false,wipe:false,me:''};

const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.me=LS.get('mhw-me','');S.outbox=LS.get('mhw-outbox',[]);
{const mv=LS.get('mhw-mv',null);if(mv&&mv.items)S.mv={...S.mv,...mv,step:'items'};}

/* ---------- utilidades ---------- */
function pad(n){return String(n).padStart(2,'0')}
function todayKey(){return dayKey(new Date().toISOString())}
function dayKey(iso){const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function midnight(D){return new Date(D+'T00:00:00').toISOString()}
function nextDay(D){const d=new Date(D+'T12:00:00');d.setDate(d.getDate()+1);return dayKey(d.toISOString())}
function fmtDay(D,long){return new Date(D+'T12:00:00').toLocaleDateString('es-ES',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function cu(units,upc){units=Math.round(units||0);if(!upc||upc<=1)return units+' u';const s=units<0?'-':'';const a=Math.abs(units),c=Math.floor(a/upc),u=a%upc;
  return s+(c?c+' cj':'')+(c&&u?' + ':'')+(u||!c?u+' u':'')}
function cfg(){return {...DEFAULT_CFG,...(S.cfg||{})}}
function isPlainObj(o){return o&&typeof o==='object'&&!Array.isArray(o)}
function deepMerge(a,b){const o={...(a||{})};for(const[k,v]of Object.entries(b||{}))o[k]=isPlainObj(v)&&isPlainObj(o[k])?deepMerge(o[k],v):v;return o}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- datos (servidor + cola local) ---------- */
function view(col){
  const m={};for(const[k,v]of Object.entries(S.srv[col]))m[k]={...v,id:k};
  for(const it of S.outbox){const[c,id]=it.path.split('/');if(c!==col)continue;
    if(it.op==='set')m[id]={...it.data,id,pending:true};
    else if(it.op==='update')m[id]={...deepMerge(m[id],it.data),id,pending:true};
    else if(it.op==='delete')delete m[id];}
  return m}
function products(all){return Object.values(view('products')).filter(p=>all||p.active!==false)
  .sort((a,b)=>(CATS.indexOf(a.cat)-CATS.indexOf(b.cat))||a.name.localeCompare(b.name,'es'))}
function P(id){return view('products')[id]}
function movs(){return Object.values(view('movements')).sort((a,b)=>a.at<b.at?1:-1)}
function activeMovs(){return movs().filter(m=>!m.voided)}
function counts(){return view('counts')}

function bodegaSign(m){if(m.type==='entrada'||m.type==='devolucion')return 1;if(m.type==='salida')return -1;
  if(m.type==='merma')return(!m.zone||m.zone===BODEGA)?-1:0;return 0}
function stockAt(t,excl){
  const cs=Object.values(counts()).filter(c=>c.status==='closed'&&c.closedAt&&c.id!==excl&&(!t||c.closedAt<=t)).sort((a,b)=>a.closedAt<b.closedAt?-1:1);
  const base=cs[cs.length-1],st={};
  if(base)for(const[k,v]of Object.entries(base.items||{}))st[k]=v;
  for(const m of activeMovs()){if(base&&m.at<=base.closedAt)continue;if(t&&m.at>t)continue;const s=bodegaSign(m);
    if(s)for(const[k,v]of Object.entries(m.items||{}))st[k]=(st[k]||0)+s*v}
  return {st,base}}
function flows(from,to){
  const pr={},zn={};
  for(const m of activeMovs()){if(from&&m.at<=from)continue;if(to&&m.at>to)continue;
    for(const[pid,v]of Object.entries(m.items||{})){const r=pr[pid]||(pr[pid]={ent:0,sal:0,dev:0,mer:0,merZ:0});
      if(m.type==='entrada')r.ent+=v;else if(m.type==='salida')r.sal+=v;else if(m.type==='devolucion')r.dev+=v;
      else if(m.type==='merma'){if(bodegaSign(m))r.mer+=v;else r.merZ+=v}
      if(m.zone&&m.zone!==BODEGA&&m.type!=='entrada'){const z=zn[m.zone]||(zn[m.zone]={}),zr=z[pid]||(z[pid]={sal:0,dev:0,mer:0});
        if(m.type==='salida')zr.sal+=v;else if(m.type==='devolucion')zr.dev+=v;else zr.mer+=v}}}
  return {pr,zn}}
function dayReport(D){
  const C=counts(),ap=C[D+'_apertura'],ci=C[D+'_cierre'];
  const apC=ap&&ap.status==='closed',ciC=ci&&ci.status==='closed';
  const start=apC?ap.closedAt:midnight(D),end=ciC?ci.closedAt:midnight(nextDay(D));
  const ini=apC?{...(ap.items||{})}:stockAt(start,ciC?ci.id:null).st;
  const f=flows(start,end),rows=[];
  for(const p of products(true)){const r=f.pr[p.id]||{ent:0,sal:0,dev:0,mer:0,merZ:0},i=ini[p.id]||0;
    const teo=i+r.ent-r.sal+r.dev-r.mer,cont=ciC?(ci.items||{})[p.id]||0:null;
    if(!i&&!r.ent&&!r.sal&&!r.dev&&!r.mer&&!teo&&!cont)continue;
    rows.push({p,ini:i,...r,teo,cont,dif:cont==null?null:cont-teo})}
  return {D,ap,ci,apC,ciC,rows,zn:f.zn}}

/* ---------- cola de escritura (sin conexión) ---------- */
function persistOutbox(){LS.set('mhw-outbox',S.outbox.map(({inflight,...r})=>r))}
function enqueue(path,op,data){
  const last=S.outbox[S.outbox.length-1];
  if(last&&!last.inflight&&last.path===path){
    if(op==='update'&&(last.op==='update'||last.op==='set')){last.data=deepMerge(last.data,data);persistOutbox();scheduleFlush();rerender();return}
    if(op==='set'||op==='delete'){last.op=op;last.data=data;persistOutbox();scheduleFlush();rerender();return}}
  S.outbox.push({path,op,data});persistOutbox();scheduleFlush();rerender()}
function scheduleFlush(ms){clearTimeout(scheduleFlush._t);scheduleFlush._t=setTimeout(flush,ms??350)}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))])}
async function flush(){
  if(S.flushing||!S.db||!S.outbox.length)return;S.flushing=true;
  try{while(S.outbox.length){const it=S.outbox[0];it.inflight=true;
      try{const ref=S.db.doc(it.path);
        await withTimeout(it.op==='set'?ref.set(it.data):it.op==='update'?ref.update(it.data):ref.delete(),15000);
        S.outbox.shift();persistOutbox();if(S.online!=='live')setOnline('live')}
      catch(e){it.inflight=false;
        if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'||e.code==='transform_error')){
          S.outbox.shift();persistOutbox();
          toast(e.code==='quota_exceeded'?'La base de datos está llena: no se guardó un cambio.':S.canWrite?'Un cambio no se pudo guardar (sin permiso de escritura o dato no válido).':'No tienes permiso para guardar cambios.');continue}
        setOnline('offline');scheduleFlush(15000);break}}}
  finally{S.flushing=false;rerender()}}
window.addEventListener('online',()=>scheduleFlush(100));

function setOnline(s){S.online=s;paintConn()}
function paintConn(){const el=document.getElementById('conn'),n=S.outbox.length;el.dataset.s=S.online==='live'&&n?'sync':S.online;
  el.textContent=S.online==='loading'?'Conectando…':S.online==='local'?'Solo este móvil':
    S.online==='offline'?'Sin conexión'+(n?' · '+n:''):n?'Enviando '+n+'…':'Al día'}

/* ---------- render ---------- */
const V=document.getElementById('view'),BAR=document.getElementById('bar');
let needsRender=false;
function typing(){const a=document.activeElement;return a&&V.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')}
function rerender(){paintConn();if(typing()){needsRender=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needsRender&&!typing()){needsRender=false;render()}},0));
document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button data-go="${k}"><span class="pip">${ic(k)}</span>${l}</button>`).join('');

function render(){
  const c=cfg();document.getElementById('evname').textContent=c.event;document.getElementById('evsub').textContent='Bodega · '+c.venue;
  const cur=SUB[S.tab]||S.tab;
  document.querySelectorAll('nav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===cur?'page':'false'));
  BAR.innerHTML='';
  const fn={inicio:vInicio,mover:vMover,contar:vContar,historial:vHist,reportes:vRep,productos:vProd,ajustes:vAjustes,mas:vMas}[S.tab]||vInicio;
  const y=window.scrollY;V.innerHTML=fn();window.scrollTo(0,y);
  if(S.tab==='mover'&&S.mv.step==='confirm')setupSig();
  paintConn()}
function dock(inner){BAR.innerHTML=`<div class="dock"><div class="wrap"><div>${inner}</div></div></div>`}

function readOnlyNote(){return S.canWrite?'':`<div class="notice bad">${ic('alert')}<div>Solo puedes ver los datos. Pide al responsable que te comparta la app como <b>editor</b> para poder registrar.</div></div>`}
function nameNote(){return S.me?'':`<div class="card stack" style="gap:10px"><b>¿Cómo te llamas?</b><span class="small muted">Tu nombre queda en cada movimiento y en los reportes.</span>
  <div class="row"><input id="me-in" placeholder="Nombre y apellido" style="flex:1 1 180px" autocomplete="name"><button class="btn primary" data-act="save-me">Guardar</button></div></div>`}
function noProducts(){return `<div class="card empty"><div class="ic">${ic('productos')}</div><b>Aún no hay productos</b><span>Añade el catálogo de bebidas: uno a uno, pegando la lista desde Excel o con productos de ejemplo para practicar.</span><button class="btn primary" data-go="productos">${ic('plus')}Ir a productos</button></div>`}
function searchBox(id,val){return `<div class="search">${ic('search')}<input id="${id}" type="search" placeholder="Buscar bebida" value="${esc(val)}" autocomplete="off"></div>`}
function dayChips(sel,act){const c=cfg(),days=[...c.days];const t=todayKey();if(!days.includes(t))days.push(t);if(sel&&!days.includes(sel))days.push(sel);days.sort();
  return `<div class="chips">${days.map(d=>{const n=c.days.indexOf(d);return `<button class="chip" data-act="${act}" data-day="${d}" aria-pressed="${d===sel}">${n>=0?'Día '+(n+1)+' · ':''}${esc(fmtDay(d))}${d===t?' (hoy)':''}</button>`}).join('')}</div>`}
function catChips(sel,act){return `<div class="chips"><button class="chip" data-act="${act}" data-cat="" aria-pressed="${!sel}">Todas</button>${CATS.filter(k=>products().some(p=>p.cat===k)).map(k=>`<button class="chip" data-act="${act}" data-cat="${esc(k)}" aria-pressed="${sel===k}">${esc(k)}</button>`).join('')}</div>`}
function filterP(q,cat){q=(q||'').toLowerCase();return products().filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+' '+p.format).toLowerCase().includes(q)))}
function grouped(list,rowFn){let out='',last='';for(const p of list){if(p.cat!==last){last=p.cat;out+=`<div class="cathead">${esc(p.cat||'Sin categoría')}</div>`}out+=rowFn(p)}return out}
function backBtn(){return `<button class="btn ghost back" data-go="mas">${ic('back')}Más</button>`}
function cntState(c){if(!c)return '<span class="pill warn">Pendiente</span>';if(c.status==='closed')return `<span class="pill ok">${ic('check')}Cerrado ${fmtTime(c.closedAt)}</span>`;return '<span class="pill">En curso</span>'}

/* --- Inicio --- */
function vInicio(){
  const ps=products(),{st,base}=stockAt(null),t=todayKey(),c=cfg(),n=c.days.indexOf(t);
  const low=ps.filter(p=>p.min>0&&(st[p.id]||0)<p.min);
  const salHoy=activeMovs().filter(m=>m.type==='salida'&&dayKey(m.at)===t);
  const C=counts(),list=filterP(S.q,S.cat);
  const greet=new Date().getHours()<14?'Buenos días':new Date().getHours()<21?'Buenas tardes':'Buenas noches';
  return `<div class="stack">
  <div class="hello"><span class="eyebrow">${n>=0?'Día '+(n+1)+' de '+c.days.length+' · ':''}${esc(fmtDay(t,true))}</span><h1>${greet}${S.me?', '+esc(S.me.split(' ')[0]):''}</h1></div>
  ${nameNote()}${readOnlyNote()}
  <div class="actions">
    <button class="act hero" data-act="start" data-type="salida"><span class="ic">${ic('salida')}</span><div><b>Salida a zona</b><br><span>${salHoy.length?salHoy.length+' entregas hoy':'Palcos y restaurante'}</span></div><span class="go">${ic('chev')}</span></button>
    <button class="act" data-act="start" data-type="entrada"><span class="ic">${ic('entrada')}</span><b>Entrada</b><span>De proveedor</span></button>
    <button class="act" data-act="start" data-type="devolucion"><span class="ic">${ic('devolucion')}</span><b>Devolución</b><span>Vuelve a bodega</span></button>
    <button class="act" data-act="start" data-type="merma"><span class="ic">${ic('merma')}</span><b>Merma</b><span>Rotura o pérdida</span></button>
  </div>
  <div class="sec"><div class="sec-h"><h2>Conteos de hoy</h2></div>
   <div class="counts">${['apertura','cierre'].map(k=>`<button class="cnt" data-act="goto-count" data-kind="${k}"><b>${k==='apertura'?'Apertura':'Cierre'}</b>${cntState(C[t+'_'+k])}<span class="small muted">${k==='apertura'?'Antes de la primera salida':'Al terminar el servicio'}</span></button>`).join('')}</div></div>
  ${low.length?`<div class="sec"><div class="sec-h"><h2>Bajo mínimo</h2><span class="pill bad">${low.length}</span></div><div class="alerts">${low.map(p=>`<div class="alert">${ic('alert')}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="small muted">Mínimo ${esc(cu(p.min,p.upc))}</div></div><div class="qty">${esc(cu(st[p.id]||0,p.upc))}</div></div>`).join('')}</div></div>`:''}
  <div class="sec"><div class="sec-h"><h2>Stock en bodega</h2><span class="small muted">${base?'Base: conteo '+esc(fmtDay(dayKey(base.closedAt)))+' '+fmtTime(base.closedAt):'Sin conteo cerrado'}</span></div>
  ${!base&&ps.length?`<div class="notice">${ic('alert')}<div>Haz el <b>conteo de apertura</b> antes de empezar a mover mercancía. Hasta entonces el stock solo suma entradas y resta salidas.</div></div>`:''}
  ${ps.length?`${searchBox('q-stock',S.q)}${catChips(S.cat,'cat-stock')}
  <div class="list">${list.length?grouped(list,p=>{const v=st[p.id]||0,isLow=p.min>0&&v<p.min;
    return `<div class="prow"><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.format)}${p.upc>1?' · caja de '+p.upc:''}</small></div>
    <div class="row" style="justify-content:flex-end">${isLow?'<span class="pill bad">Bajo</span>':''}<span class="qty" style="color:${v<0||isLow?'var(--bad)':'inherit'}">${esc(cu(v,p.upc))}</span></div></div>`}):'<div class="empty">Ninguna bebida coincide.</div>'}</div>`:noProducts()}</div>
  </div>`}

/* --- Mover --- */
function mvTotal(pid){const q=S.mv.items[pid];if(!q)return 0;const p=P(pid);return(q.c||0)*((p&&p.upc)||1)+(q.u||0)}
function mvLines(){return Object.keys(S.mv.items).filter(pid=>P(pid)&&mvTotal(pid)>0)}
function saveMv(){const {step,...rest}=S.mv;LS.set('mhw-mv',{...rest,sig:''})}
function stepper(ctx,pid,f,val,label){return `<div class="step"><button data-act="dec" data-ctx="${ctx}" data-pid="${pid}" data-f="${f}" aria-label="Menos ${label}">−</button><label><input inputmode="numeric" pattern="[0-9]*" id="${ctx}-${f}-${pid}" data-qty data-ctx="${ctx}" data-pid="${pid}" data-f="${f}" value="${val||''}" placeholder="0"><span>${label}</span></label><button data-act="inc" data-ctx="${ctx}" data-pid="${pid}" data-f="${f}" aria-label="Más ${label}">+</button></div>`}
function typeSeg(){return `<div class="seg">${Object.entries(TYPES).map(([k,t])=>`<button data-act="mv-type" data-type="${k}" aria-pressed="${S.mv.type===k}">${ic(k)}${t.label}</button>`).join('')}</div>`}
function zoneGrid(){const m=S.mv,zones=m.type==='merma'?[BODEGA,...cfg().zones]:cfg().zones,t=todayKey();
  const hoy={};for(const x of activeMovs())if(x.type==='salida'&&dayKey(x.at)===t)hoy[x.zone]=(hoy[x.zone]||0)+1;
  const q=m.type==='salida'?'¿A qué zona va?':m.type==='devolucion'?'¿Qué zona devuelve?':'¿Dónde se produjo?';
  return `<h1>${q}</h1><div class="zones">${zones.map(z=>{const mm=/^Palco\s+(\S+)$/i.exec(z);
    return mm?`<button class="zone" data-act="mv-zone" data-zone="${esc(z)}"><span>Palco</span><b>${esc(mm[1])}</b>${hoy[z]?`<em>${hoy[z]} hoy</em>`:''}</button>`
      :`<button class="zone wide" data-act="mv-zone" data-zone="${esc(z)}"><b>${esc(z)}</b>${hoy[z]?`<em>${hoy[z]} entregas hoy</em>`:''}</button>`}).join('')}</div>`}
function vMover(){
  const m=S.mv,ps=products();
  if(S.lastSaved){const L=S.lastSaved;return `<div class="card done"><div class="ic">${ic('check')}</div><h1>${esc(TYPES[L.type].long)} registrada</h1>
    <div class="muted">${L.type==='entrada'?'Bodega':esc(L.zone||'')} · ${L.n} ${L.n===1?'producto':'productos'} · ${fmtTime(L.at)}</div>
    ${S.outbox.length?`<div class="notice" style="text-align:left">${ic('alert')}<div>Sin conexión: se guardó en este móvil y se enviará solo al volver la cobertura.</div></div>`:''}
    <div class="stack" style="width:100%;gap:10px;margin-top:6px">${L.type==='salida'?`<button class="btn primary block" data-act="vale" data-id="${L.id}">${ic('pdf')}Descargar vale de entrega</button>`:''}
    <button class="btn block" data-act="mv-new">${L.type==='salida'?'Otra salida':'Nuevo movimiento'}</button><button class="btn ghost block" data-go="inicio">Volver al inicio</button></div></div>`}
  if(!ps.length)return `<div class="stack"><h1>Mover mercancía</h1>${noProducts()}</div>`;
  if(m.type!=='entrada'&&!m.zone)return `<div class="stack">${nameNote()}${readOnlyNote()}${typeSeg()}${zoneGrid()}</div>`;
  const dest=m.type==='entrada'?`<label class="f">Proveedor / nº de albarán<input id="mv-ref" value="${esc(m.ref)}" placeholder="Ej. Distribuidora · ALB-20931"></label>`
    :`<div class="dest">${ic(m.type)}<div><div class="small muted">${m.type==='salida'?'Destino':m.type==='devolucion'?'Devuelve':'Lugar'}</div><b>${esc(m.zone)}</b></div><button class="btn" data-act="mv-zone-clear">Cambiar</button></div>`;
  if(m.step==='confirm'){const lines=mvLines(),tot=lines.reduce((a,pid)=>a+mvTotal(pid),0);
    dock(`<button class="btn sec" data-act="mv-back">${ic('back')}Editar</button><div class="sum"><b>${lines.length} productos</b><br><span class="muted">${tot} unidades</span></div><button class="btn primary" data-act="mv-save" ${S.canWrite?'':'disabled'}>${ic('check')}Confirmar</button>`);
    return `<div class="stack"><span class="eyebrow">Revisar y confirmar</span><h1>${esc(TYPES[m.type].long)}</h1>${dest}
    <div class="list">${lines.map(pid=>{const p=P(pid);return `<div class="prow"><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.format)}</small></div><div class="qty">${esc(cu(mvTotal(pid),p.upc))}</div></div>`}).join('')}</div>
    ${m.type==='salida'?`<label class="f">Quién recibe<input id="mv-rec" value="${esc(m.receiver)}" placeholder="Responsable del palco o del restaurante" autocomplete="off"></label>
      <div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="small muted" style="font-weight:600">Firma de quien recibe (opcional)</span><button class="btn ghost" data-act="sig-clear" style="min-height:32px;padding:4px 8px">Borrar</button></div><canvas class="sig" id="sig" width="600" height="180" aria-label="Zona de firma"></canvas></div>`:''}
    <label class="f">${m.type==='merma'?'Motivo (rotura, caducado, invitación…)':'Nota (opcional)'}<textarea id="mv-note" placeholder="${m.type==='merma'?'Obligatorio en mermas':''}">${esc(m.note)}</textarea></label>
    <div class="small muted">Lo registra: <b>${esc(S.me||'sin nombre')}</b></div></div>`}
  const {st}=stockAt(null),list=filterP(m.q,m.cat),lines=mvLines(),tot=lines.reduce((a,pid)=>a+mvTotal(pid),0);
  dock(`<div class="sum" id="mvsum">${sumText(lines.length,tot)}</div><button class="btn sec" data-act="mv-clear" id="mv-clear" ${lines.length?'':'hidden'}>Vaciar</button><button class="btn primary" data-act="mv-review" id="mv-review" ${lines.length?'':'disabled'}>Revisar${ic('chev')}</button>`);
  return `<div class="stack">${nameNote()}${readOnlyNote()}${typeSeg()}${dest}
   ${searchBox('q-mv',m.q)}${catChips(m.cat,'cat-mv')}
   <div class="list">${list.length?grouped(list,p=>{const q=m.items[p.id]||{},v=st[p.id]||0,tt=mvTotal(p.id),over=m.type==='salida'&&tt>v;
     return `<div class="prow ${tt?'on':''}" id="row-${p.id}"><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.format)} · en bodega ${esc(cu(v,p.upc))}</small>${over?' <span class="pill warn">Más que el stock</span>':''}</div>
     <div class="steps">${p.upc>1?stepper('mv',p.id,'c',q.c,'cajas'):''}${stepper('mv',p.id,'u',q.u,'uds')}</div></div>`}):'<div class="empty">Ninguna bebida coincide.</div>'}</div></div>`}
function sumText(n,tot){return n?`<b>${n} ${n===1?'producto':'productos'}</b><br><span class="muted">${tot} unidades</span>`:'<span class="muted">Marca las cantidades</span>'}

/* --- Contar --- */
function vContar(){
  const ps=products();if(!ps.length)return `<div class="stack"><h1>Conteo</h1>${noProducts()}</div>`;
  const id=S.day+'_'+S.cntKind,c=counts()[id];
  const head=`<div class="stack"><div class="hello"><span class="eyebrow">Inventario de bodega</span><h1>Conteo de ${S.cntKind}</h1></div>${readOnlyNote()}${dayChips(S.day,'cnt-day')}
   <div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="cnt-kind" data-kind="apertura" aria-pressed="${S.cntKind==='apertura'}">Apertura</button><button data-act="cnt-kind" data-kind="cierre" aria-pressed="${S.cntKind==='cierre'}">Cierre</button></div>`;
  if(!c)return head+`<div class="card empty"><div class="ic">${ic('contar')}</div><b>${esc(fmtDay(S.day,true))}</b>
    <span>${S.cntKind==='apertura'?'Cuenta la bodega antes de la primera salida del día.':'Cuenta la bodega cuando termine el servicio del día.'} Podéis contar los tres a la vez: cada uno marca sus productos y todo va al mismo conteo.</span>
    <button class="btn primary" data-act="cnt-start" ${S.canWrite?'':'disabled'}>Empezar conteo</button></div></div>`;
  const closed=c.status==='closed',teo=stockAt(closed?c.closedAt:null,id).st,items=c.items||{};
  const list=filterP(S.q,S.cat);let done=0,difs=0;
  for(const p of ps){if(items[p.id]!=null)done++;if(items[p.id]!=null&&items[p.id]!==(teo[p.id]||0))difs++}
  dock(`<div class="sum" id="cntsum">${cntSum(done,ps.length,difs)}</div>${closed?`<button class="btn sec" data-act="cnt-reopen" ${S.canWrite?'':'disabled'}>Reabrir</button>`:`<button class="btn primary" data-act="cnt-close" ${S.canWrite?'':'disabled'}>${ic('check')}Cerrar conteo</button>`}`);
  return head+`${closed?`<div class="notice ok">${ic('check')}<div>Cerrado a las <b>${fmtTime(c.closedAt)}</b>${c.closedBy?' por '+esc(c.closedBy):''}. Es la nueva base del stock.</div></div>`:'<div class="small muted">Se guarda solo mientras cuentas. Lo que no cuentes vale 0 al cerrar.</div>'}
   ${searchBox('q-stock',S.q)}${catChips(S.cat,'cat-stock')}
   <div class="list">${grouped(list,p=>{const u=items[p.id],has=u!=null,t=teo[p.id]||0,upc=p.upc||1;
     const cc=has&&upc>1?Math.floor(u/upc):'',uu=has?(upc>1?u%upc:u):'';
     return `<div class="prow ${has?'on':''}" id="row-${p.id}"><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.format)}</small></div>
     ${closed?`<div class="qty">${esc(cu(u||0,upc))}</div>`:`<div class="steps">${upc>1?stepper('cnt',p.id,'c',cc,'cajas'):''}${stepper('cnt',p.id,'u',uu,'uds')}</div>`}
     <div class="diff" id="d-${p.id}">${diffText(has,u||0,t,upc)}</div></div>`})}</div></div>`}
function diffText(has,u,t,upc){if(!has)return `<span class="muted">Debería haber ${esc(cu(t,upc))} · sin contar</span>`;const d=u-t;
  return `<span class="muted">Debería haber ${esc(cu(t,upc))} · </span>${d?`<span class="bad">Diferencia ${d>0?'+':''}${esc(cu(d,upc))}</span>`:'<span class="ok">Cuadra ✓</span>'}`}
function cntSum(done,n,difs){return `<b>${done} de ${n}</b> contados<br>${difs?`<span style="color:var(--bad-soft);font-weight:700">${difs} con diferencia</span>`:'<span class="muted">sin diferencias</span>'}`}

     ${open?`<div class="detail" data-stop>${Object.entries(m.items||{}).map(([pid,v])=>{const p=P(pid);return `<div class="row small"><span style="flex:1">${esc(p?p.name:'(producto borrado)')}</span><b class="num">${esc(cu(v,p&&p.upc))}</b></div>`}).join('')}
      ${m.note?`<div class="small"><b>Nota:</b> ${esc(m.note)}</div>`:''}${m.voided?`<div class="small" style="color:var(--bad)"><b>Anulado:</b> ${esc(m.voidReason||'')} (${esc(m.voidBy||'')})</div>`:''}

   :`<div class="card empty"><div class="ic">${ic('historial')}</div><b>Sin movimientos</b><span>No hay movimientos registrados este día.</span></div>`}

   <div class="grid2"><button class="btn primary" data-act="pdf-day">${ic('pdf')}Cierre del día (PDF)</button><button class="btn" data-act="pdf-event">${ic('pdf')}Resumen del evento</button></div>
   <div class="sec"><h2>Cierre · ${esc(fmtDay(D,true))}</h2>
   ${R.rows.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Inicial</th><th>Entr.</th><th>Salid.</th><th>Dev.</th><th>Merma</th><th>Debería</th><th>Contado</th><th>Dif.</th></tr></thead><tbody>
   ${R.rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${r.ini}</td><td>${r.ent}</td><td>${r.sal}</td><td>${r.dev}</td><td>${r.mer}</td><td>${r.teo}</td><td>${r.cont??'—'}</td><td class="${r.dif?'neg':''}">${r.dif==null?'—':(r.dif>0?'+':'')+r.dif}</td></tr>`).join('')}
   </tbody></table></div><p class="small muted">En unidades. Periodo: ${R.apC?'desde el conteo de apertura ('+fmtTime(R.ap.closedAt)+')':'desde las 00:00'} hasta ${R.ciC?'el conteo de cierre ('+fmtTime(R.ci.closedAt)+')':'las 24:00'}.</p>`:`<div class="card empty"><b>Sin datos</b><span>No hay stock ni movimientos este día.</span></div>`}</div>
   <div class="sec"><h2>Consumo por zona</h2>${zoneTable(R.zn)}</div>
   <div class="sec"><h2>Copia de seguridad</h2><div class="card row" style="justify-content:space-between"><span class="small muted" style="flex:1 1 200px">Todos los movimientos del evento en un archivo que abre Excel.</span><button class="btn" data-act="csv">Exportar CSV</button></div></div></div>`}
function zoneRows(zn){const out=[];for(const z of cfg().zones){const zz=zn[z];if(!zz)continue;let t=0;const items=[];
  for(const[pid,r]of Object.entries(zz)){const p=P(pid);const net=r.sal-r.dev;t+=net;items.push({p,...r,net})}out.push({z,t,items})}return out}
function zoneTable(zn){const zs=zoneRows(zn);if(!zs.length)return '<div class="card empty"><span>Sin salidas a zonas en este periodo.</span></div>';
  return `<div class="tablewrap"><table><thead><tr><th>Zona / producto</th><th>Salidas</th><th>Devol.</th><th>Merma</th><th>Consumo</th></tr></thead><tbody>
  ${zs.map(z=>`<tr><td><b>${esc(z.z)}</b></td><td></td><td></td><td></td><td><b>${z.t}</b></td></tr>`+z.items.map(i=>`<tr><td class="muted">&nbsp;&nbsp;${esc(i.p?i.p.name:'?')}</td><td>${i.sal}</td><td>${i.dev}</td><td>${i.mer}</td><td>${i.net}</td></tr>`).join('')).join('')}</tbody></table></div>`}

/* ---------- acciones ---------- */
const TABNAMES=['inicio','mover','contar','reportes','mas','historial','productos','ajustes'];
function go(tab){if(!TABNAMES.includes(tab))tab='inicio';S.tab=tab;S.open=null;S.voiding=null;if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==S.tab)go(t)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.go==='mover'&&S.tab!=='mover'&&S.lastSaved)S.lastSaved=null;go(g.dataset.go);return}
  if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  const A={
    'save-me'(){const v=(document.getElementById('me-in').value||'').trim();if(!v)return toast('Escribe tu nombre');S.me=v;LS.set('mhw-me',v);toast('Guardado');render()},
    'cat-stock'(){S.cat=d.cat;render()},'cat-mv'(){S.mv.cat=d.cat;render()},
    start(){if(S.mv.type!==d.type){S.mv.type=d.type;S.mv.zone=''}S.mv.step='items';S.lastSaved=null;saveMv();go('mover')},
    'goto-count'(){S.day=todayKey();S.cntKind=d.kind;go('contar')},
    'mv-type'(){S.mv.type=d.type;S.mv.zone='';saveMv();render()},
    'mv-zone'(){S.mv.zone=d.zone;saveMv();render();window.scrollTo(0,0)},'mv-zone-clear'(){S.mv.zone='';saveMv();render()},
    inc(){bump(d,1)},dec(){bump(d,-1)},
    'mv-clear'(){S.mv.items={};saveMv();render()},
    'mv-review'(){const m=S.mv;if(m.type!=='entrada'&&!m.zone)return toast('Elige la zona');S.mv.step='confirm';render();window.scrollTo(0,0)},
    'mv-back'(){S.mv.step='items';render()},
    'mv-save':saveMovement,'mv-new'(){S.lastSaved=null;render()},
    'sig-clear'(){S.mv.sig='';render()},
    vale(){pdfVale(d.id)},
    'cnt-day'(){S.day=d.day;render()},'cnt-kind'(){S.cntKind=d.kind;render()},
    'cnt-start'(){enqueue('counts/'+S.day+'_'+S.cntKind,'set',{day:S.day,kind:S.cntKind,status:'draft',items:{},startedBy:S.me||'',startedAt:new Date().toISOString()})},
    'cnt-close'(){const id=S.day+'_'+S.cntKind,c=counts()[id],items={...(c.items||{})};for(const p of products())if(items[p.id]==null)items[p.id]=0;
      enqueue('counts/'+id,'update',{items,status:'closed',closedAt:new Date().toISOString(),closedBy:S.me||''});toast('Conteo cerrado')},
    'cnt-reopen'(){enqueue('counts/'+S.day+'_'+S.cntKind,'update',{status:'draft',closedAt:null})},
    'hist-day'(){S.day=d.day;S.open=null;render()},'hist-type'(){S.histType=d.type;render()},
    'mov-open'(){S.open=S.open===d.id?null:d.id;S.voiding=null;render()},
    void(){S.voiding=d.id;render();document.getElementById('void-reason')?.focus()},
    'void-ok'(){const r=(document.getElementById('void-reason').value||'').trim();if(!r)return toast('Escribe el motivo');
      enqueue('movements/'+d.id,'update',{voided:true,voidReason:r,voidBy:S.me||'',voidAt:new Date().toISOString()});S.voiding=null;toast('Movimiento anulado')},
    'rep-day'(){S.repDay=d.day;render()},'pdf-day'(){pdfDay(S.repDay||S.day)},'pdf-event':pdfEvent,csv:exportCsv,
    'p-new'(){S.editP={cat:CATS[0],upc:24,min:0};render();window.scrollTo(0,0)},
    'p-edit'(){if(!S.canWrite)return;S.editP={...P(d.id)};S.importOpen=false;render();window.scrollTo(0,0)},
    'p-cancel'(){S.editP=null;render()},'p-save':saveProduct,
    'p-del'(){enqueue('products/'+S.editP.id,'delete',null);S.editP=null;toast('Producto eliminado')},
    'imp-open'(){S.importOpen=true;S.editP=null;render()},'imp-cancel'(){S.importOpen=false;render()},'imp-go':doImport,
    samples(){for(const[i,r]of SAMPLE.entries())enqueue('products/ej-'+i,'set',{name:r[0]+' (ejemplo)',cat:r[1],format:r[2],upc:r[3],min:r[4],price:r[5],active:true});toast('Productos de ejemplo cargados')},
    'samples-del'(){const used=usedIds();let n=0;for(const p of products(true))if(p.id.startsWith('ej-')&&!used.has(p.id)){enqueue('products/'+p.id,'delete',null);n++}
      toast(n?n+' productos de ejemplo quitados':'Los ejemplos tienen movimientos: borra antes los datos de prueba en Ajustes')},
    'cfg-save':saveCfg,
    wipe(){S.wipe=true;render()},'wipe-cancel'(){S.wipe=false;render()},
    'wipe-ok'(){if((document.getElementById('wipe-in').value||'').trim().toUpperCase()!=='BORRAR')return toast('Escribe BORRAR para confirmar');
      for(const id of Object.keys(view('movements')))enqueue('movements/'+id,'delete',null);for(const id of Object.keys(counts()))enqueue('counts/'+id,'delete',null);
      S.wipe=false;toast('Borrando movimientos y conteos…')}
  };
  if(A[a]){e.preventDefault();A[a]()}});

document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q-stock'){S.q=t.value;softList();return}

function softList(){const id=document.activeElement&&document.activeElement.id;render();const el=id&&document.getElementById(id);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(_){}}}

function bump(d,delta){const el=document.getElementById(d.ctx+'-'+d.f+'-'+d.pid);const v=Math.max(0,(parseInt(el.value,10)||0)+delta);el.value=v||'';setQty(d,v)}
function setQty(d,v){v=isNaN(v)?0:Math.max(0,v);const p=P(d.pid);if(!p)return;const row=document.getElementById('row-'+d.pid);
  if(d.ctx==='mv'){const q=S.mv.items[d.pid]||(S.mv.items[d.pid]={c:0,u:0});q[d.f]=v;saveMv();
    const lines=mvLines(),tot=lines.reduce((a,pid)=>a+mvTotal(pid),0);const s=document.getElementById('mvsum');if(s)s.innerHTML=sumText(lines.length,tot);
    if(row)row.classList.toggle('on',mvTotal(d.pid)>0);
    const cb=document.getElementById('mv-clear');if(cb)cb.hidden=!lines.length;
    const rb=document.getElementById('mv-review');if(rb)rb.disabled=!lines.length;return}
  if(!S.canWrite)return;
  const upc=p.upc||1,cEl=document.getElementById('cnt-c-'+d.pid),uEl=document.getElementById('cnt-u-'+d.pid);
  const units=(upc>1&&cEl?(parseInt(cEl.value,10)||0)*upc:0)+((uEl&&parseInt(uEl.value,10))||0);
  const id=S.day+'_'+S.cntKind;enqueue('counts/'+id,'update',{items:{[d.pid]:units}});if(row)row.classList.add('on');
  const c=counts()[id],teo=stockAt(null,id).st;const dEl=document.getElementById('d-'+d.pid);if(dEl)dEl.innerHTML=diffText(true,units,teo[d.pid]||0,upc);
  const ps=products(),items=c.items||{};let done=0,difs=0;for(const q of ps){if(items[q.id]!=null)done++;if(items[q.id]!=null&&items[q.id]!==(teo[q.id]||0))difs++}
  const s=document.getElementById('cntsum');if(s)s.innerHTML=cntSum(done,ps.length,difs)}

function saveMovement(){
  const m=S.mv,items={};for(const pid of mvLines())items[pid]=mvTotal(pid);
  if(!Object.keys(items).length)return toast('Añade al menos un producto');
  if(m.type!=='entrada'&&!m.zone)return toast('Elige la zona');
  if(m.type==='merma'&&!m.note.trim())return toast('Escribe el motivo de la merma');
  const id=uid('m'),at=new Date().toISOString();
  const doc={type:m.type,zone:m.type==='entrada'?BODEGA:m.zone,items,ref:m.ref||'',note:m.note||'',receiver:m.type==='salida'?(m.receiver||''):'',sig:m.type==='salida'?(m.sig||''):'',by:S.me||'',uid:S.uid||'',at};
  enqueue('movements/'+id,'set',doc);
  S.lastSaved={id,type:m.type,zone:doc.zone,n:Object.keys(items).length,at};
  S.mv={type:m.type,zone:m.type==='salida'?'':m.zone,items:{},ref:'',note:'',receiver:'',sig:'',step:'items',q:'',cat:''};saveMv();render();window.scrollTo(0,0)}

function numIn(id){const v=String(document.getElementById(id).value||'').replace(',','.').trim();return v===''?null:Number(v)}
function saveProduct(){const e=S.editP,name=document.getElementById('p-name').value.trim();if(!name)return toast('Escribe el nombre');
  const upc=Math.max(1,Math.round(numIn('p-upc')||1)),min=Math.max(0,Math.round(numIn('p-min')||0)),price=numIn('p-price');
  const doc={name,cat:document.getElementById('p-cat').value,format:document.getElementById('p-format').value.trim(),upc,min,price:price==null||isNaN(price)?null:price,active:document.getElementById('p-active').value==='1'};
  enqueue('products/'+(e.id||uid('p')),'set',doc);S.editP=null;toast('Producto guardado')}
async function doImport(){let txt=document.getElementById('imp-text').value;const f=document.getElementById('imp-file').files[0];if(f)txt+='\n'+await f.text();
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let n=0;
  for(const l of lines){const sep=l.includes('\t')?'\t':l.includes(';')?';':',';const c=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    if(!c[0]||/^nombre$/i.test(c[0]))continue;const cat=CATS.find(k=>k.toLowerCase()===(c[1]||'').toLowerCase())||matchCat(c[1]||c[0]);
    const num=x=>{const v=Number(String(x||'').replace(',','.'));return isNaN(v)?null:v};
    enqueue('products/'+uid('p'),'set',{name:c[0],cat,format:c[2]||'',upc:Math.max(1,Math.round(num(c[3])||1)),min:Math.max(0,Math.round(num(c[4])||0)),price:num(c[5]),active:true});n++}
  S.importOpen=false;toast(n?n+' productos importados':'No se encontró ningún producto');render()}
function matchCat(s){s=s.toLowerCase();const r=[['agua','Agua'],['cerve','Cerveza'],['blanco','Vino blanco'],['tinto','Vino tinto'],['rosado','Rosado'],['cava','Cava / Champán'],['champ','Cava / Champán'],['zumo','Zumo'],['caf','Café / otros'],
  ['gin','Destilado'],['ron','Destilado'],['whisk','Destilado'],['vodka','Destilado'],['refresc','Refresco'],['cola','Refresco'],['tónica','Refresco'],['tonica','Refresco']];for(const[k,v]of r)if(s.includes(k))return v;return 'Café / otros'}
function saveCfg(){const days=document.getElementById('c-days').value.split(/[,\s]+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
  const zones=document.getElementById('c-zones').value.split(/\n/).map(z=>z.trim()).filter(Boolean);
  if(!days.length)return toast('Revisa los días: formato 2026-11-26');if(!zones.length)return toast('Añade al menos una zona');
  enqueue('config/event','set',{event:document.getElementById('c-event').value.trim()||DEFAULT_CFG.event,venue:document.getElementById('c-venue').value.trim(),caterer:document.getElementById('c-caterer').value.trim(),days,zones});
  S.cfg={...cfg(),days,zones};toast('Evento guardado')}

/* ---------- firma ---------- */
function setupSig(){const cv=document.getElementById('sig');if(!cv)return;const ctx=cv.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#111';
  if(S.mv.sig){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=S.mv.sig}
  let draw=false;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{draw=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!draw)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{if(!draw)return;draw=false;S.mv.sig=cv.toDataURL('image/png')}}

async function saveFile(name,data){const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(!dl)return toast('Esta vista no permite descargar archivos. Abre la app en claude.ai.');
  try{await dl.save({filename:name,data});toast('Archivo listo')}catch(e){if(e&&e.code==='declined')return;toast('No se pudo guardar el archivo'+(e&&e.message?': '+e.message:''))}}
function newPdf(title,sub,landscape){if(!window.jspdf){toast('El generador de PDF no ha cargado. Revisa la conexión.');return null}
  const doc=new window.jspdf.jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'}),c=cfg(),W=doc.internal.pageSize.getWidth();
  doc.setFillColor(31,90,68);doc.rect(0,0,W,22,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(title.toUpperCase(),12,10);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`${c.event} · ${c.venue}${c.caterer?' · Catering '+c.caterer:''} · Bodega`,12,16);
  doc.text(sub,W-12,10,{align:'right'});doc.text('Generado '+new Date().toLocaleString('es-ES')+(S.me?' por '+S.me:''),W-12,16,{align:'right'});doc.setTextColor(20);return doc}
const TBL={styles:{fontSize:8.5,cellPadding:1.6},headStyles:{fillColor:[227,232,225],textColor:30,fontStyle:'bold'},margin:{left:12,right:12},theme:'grid'};
function cuP(v,p){return cu(v,p&&p.upc).replace(/−/g,'-')}
function signLines(doc,y,labels){const W=doc.internal.pageSize.getWidth(),w=(W-24-10*(labels.length-1))/labels.length;
  if(y>doc.internal.pageSize.getHeight()-30){doc.addPage();y=30}doc.setFontSize(9);labels.forEach((l,i)=>{const x=12+i*(w+10);doc.line(x,y+15,x+w,y+15);doc.text(l,x,y+20)})}
function pdfDay(D){const R=dayReport(D),doc=newPdf('Inventario de cierre diario',fmtDay(D,true),true);if(!doc)return;
  doc.setFontSize(9);doc.text(`Periodo: ${R.apC?'conteo de apertura '+fmtTime(R.ap.closedAt):'00:00'} – ${R.ciC?'conteo de cierre '+fmtTime(R.ci.closedAt)+(R.ci.closedBy?' ('+R.ci.closedBy+')':''):'24:00 (cierre sin contar)'}. Cantidades en unidades.`,12,29);
  let val=0;const body=R.rows.map(r=>{if(r.p.price&&r.cont!=null)val+=r.dif*r.p.price;return[r.p.name,r.p.format||'',r.p.upc||1,r.ini,r.ent,r.sal,r.dev,r.mer,r.teo,r.cont??'-',r.dif==null?'-':(r.dif>0?'+':'')+r.dif]});
  doc.autoTable({...TBL,startY:33,head:[['Producto','Formato','Uds/caja','Inicial','Entradas','Salidas','Devol.','Mermas','Teórico','Contado','Diferencia']],body:body.length?body:[['Sin datos','','','','','','','','','','']],
    columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right',fontStyle:'bold'},10:{halign:'right',fontStyle:'bold'}},
    didParseCell:h=>{if(h.section==='body'&&h.column.index===10&&/^[+-]\d/.test(String(h.cell.raw)))h.cell.styles.textColor=[179,38,30]}});
  let y=doc.lastAutoTable.finalY+6;if(val){doc.setFontSize(9);doc.text('Valor de las diferencias a precio de coste: '+val.toFixed(2).replace('.',',')+' EUR',12,y);y+=4}
  y=zonePdf(doc,R.zn,y+2,'Consumo por zona');signLines(doc,y+4,['Responsable de bodega','Revisado por'])
  ;saveFile(`Cierre bodega ${D}.pdf`,doc.output('blob'))}
function zonePdf(doc,zn,y,title){const zs=zoneRows(zn);doc.setFont('helvetica','bold');doc.setFontSize(11);if(y>doc.internal.pageSize.getHeight()-30){doc.addPage();y=20}doc.text(title,12,y+4);doc.setFont('helvetica','normal');
  const body=[];for(const z of zs){body.push([{content:z.z,styles:{fontStyle:'bold',fillColor:[240,243,238]}},{content:'',styles:{fillColor:[240,243,238]}},{content:'',styles:{fillColor:[240,243,238]}},{content:'',styles:{fillColor:[240,243,238]}},{content:String(z.t),styles:{fontStyle:'bold',halign:'right',fillColor:[240,243,238]}}]);
    for(const i of z.items)body.push(['   '+(i.p?i.p.name:'?'),i.sal,i.dev,i.mer,i.net])}
  doc.autoTable({...TBL,startY:y+7,head:[['Zona / producto','Salidas','Devoluciones','Merma en zona','Consumo neto']],body:body.length?body:[['Sin salidas a zonas','','','','']],columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
  return doc.lastAutoTable.finalY+6}
function pdfEvent(){const c=cfg(),days=[...c.days].sort(),doc=newPdf('Resumen del evento',fmtDay(days[0])+' – '+fmtDay(days[days.length-1]),true);if(!doc)return;
  const f=flows(null,null),{st,base}=stockAt(null);let tv=0;
  const body=products(true).map(p=>{const r=f.pr[p.id]||{ent:0,sal:0,dev:0,mer:0,merZ:0},net=r.sal-r.dev,v=p.price?net*p.price:null;if(v)tv+=v;
    return(r.ent||r.sal||r.dev||r.mer||st[p.id])?[p.name,p.format||'',r.ent,r.sal,r.dev,r.mer+r.merZ,net,st[p.id]||0,p.price!=null?p.price.toFixed(2).replace('.',','):'-',v!=null?v.toFixed(2).replace('.',','):'-']:null}).filter(Boolean);
  doc.setFontSize(9);doc.text(`Stock final: ${base?'último conteo '+fmtDay(dayKey(base.closedAt))+' '+fmtTime(base.closedAt)+' más movimientos posteriores':'teórico (no hay conteos cerrados)'}. Consumo neto = salidas - devoluciones.`,12,29);
  doc.autoTable({...TBL,startY:33,head:[['Producto','Formato','Entradas','Salidas','Devol.','Mermas','Consumo neto','Stock final','Precio','Valor consumo (EUR)']],body:body.length?body:[['Sin datos','','','','','','','','','']],
    columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right',fontStyle:'bold'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right'}},
    foot:tv?[['Total','','','','','','','','',tv.toFixed(2).replace('.',',')]]:undefined,footStyles:{fillColor:[227,232,225],textColor:30,halign:'right'}});
  let y=doc.lastAutoTable.finalY+6;
  const zs=zoneRows(f.zn).map(z=>{let v=0;for(const i of z.items)if(i.p&&i.p.price)v+=i.net*i.p.price;return[z.z,z.t,v?v.toFixed(2).replace('.',','):'-']});
  doc.setFont('helvetica','bold');doc.setFontSize(11);if(y>doc.internal.pageSize.getHeight()-30){doc.addPage();y=20}doc.text('Consumo por zona (todo el evento)',12,y+4);doc.setFont('helvetica','normal');
  doc.autoTable({...TBL,startY:y+7,head:[['Zona','Unidades consumidas','Valor (EUR)']],body:zs.length?zs:[['Sin salidas','','']],columnStyles:{1:{halign:'right'},2:{halign:'right'}},tableWidth:140});
  y=doc.lastAutoTable.finalY+6;y=zonePdf(doc,f.zn,y,'Detalle por zona');signLines(doc,y+4,['Responsable de bodega','Revisado por']);
  saveFile(`Resumen bodega ${c.event}.pdf`,doc.output('blob'))}
function pdfVale(id){const m=view('movements')[id];if(!m)return toast('No se encuentra el movimiento');
  const doc=newPdf('Vale de entrega',fmtDay(dayKey(m.at),true)+' · '+fmtTime(m.at),false);if(!doc)return;
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Destino: '+(m.zone||''),12,32);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Ref. '+id+(m.voided?'   ANULADO: '+(m.voidReason||''):''),12,37);
  doc.autoTable({...TBL,startY:41,head:[['Producto','Formato','Cantidad','Unidades']],body:Object.entries(m.items||{}).map(([pid,v])=>{const p=P(pid);return[p?p.name:'(producto borrado)',p?p.format:'',cuP(v,p),v]}),columnStyles:{2:{halign:'right'},3:{halign:'right'}}});
  let y=doc.lastAutoTable.finalY+8;if(m.note){doc.text('Nota: '+m.note,12,y);y+=6}
  if(y>230){doc.addPage();y=20}doc.setFontSize(9);doc.text('Entrega (bodega): '+(m.by||''),12,y+4);doc.text('Recibe: '+(m.receiver||''),110,y+4);
  if(m.sig){try{doc.addImage(m.sig,'PNG',110,y+7,80,24,undefined,'FAST')}catch(_){}}doc.line(12,y+33,95,y+33);doc.line(110,y+33,195,y+33);doc.text('Firma',12,y+38);doc.text('Firma',110,y+38);
  saveFile(`Vale ${(m.zone||'').replace(/[^\w ]/g,'')} ${dayKey(m.at)} ${fmtTime(m.at).replace(':','')}.pdf`,doc.output('blob'))}
function exportCsv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['Fecha','Hora','Tipo','Zona','Producto','Formato','Unidades','Cantidad','Registró','Recibe','Albarán','Nota','Anulado','Motivo anulación'].map(q).join(';')];
  for(const m of movs().slice().reverse())for(const[pid,v]of Object.entries(m.items||{})){const p=P(pid);
    rows.push([dayKey(m.at),fmtTime(m.at),TYPES[m.type]?.long||m.type,m.zone,p?p.name:pid,p?p.format:'',v,cu(v,p&&p.upc),m.by,m.receiver,m.ref,m.note,m.voided?'Sí':'',m.voidReason].map(q).join(';'))}
  saveFile('Movimientos bodega '+todayKey()+'.csv','﻿'+rows.join('\r\n'))}

(async function init(){
  if(!window.claude||!window.claude.use){setOnline('local');return}
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  S.user=user;
  if(user){try{S.isOwner=await user.isOwner();const cw=await user.can('data.write');S.canWrite=cw!==false;S.uid=await user.id();
    if(!S.me){const me=await user.me();if(me&&me.name){S.me=me.name;LS.set('mhw-me',S.me)}}}catch(_){}}
  if(!db){setOnline('local');render();return}
  S.db=db;let got=0;const timer=setTimeout(()=>{if(S.online==='loading')setOnline('offline')},10000);
  const ok=snap=>{if(!snap.metadata.fromCache){got++;clearTimeout(timer);if(S.online!=='live')setOnline('live')}};
  const err=e=>{if(e&&e.code==='revoked'){S.canWrite=false}setOnline('offline');rerender()};
  for(const col of ['products','movements','counts']){
    const q=col==='movements'?db.collection(col).orderBy('at','desc').limit(1000):db.collection(col);
    q.onSnapshot(s=>{const m={};for(const d of s.docs)m[d.id]=d.data();S.srv[col]=m;ok(s);rerender()},err)}
  db.doc('config/event').onSnapshot(s=>{S.cfg=s.exists?s.data():null;rerender()},err);
  scheduleFlush(500);
})();
